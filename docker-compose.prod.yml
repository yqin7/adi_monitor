# 服务器上用的 compose：不在本机构建，直接拉 CI 推到 GHCR 的镜像。
# 放到服务器 /opt/adi_monitor/docker-compose.prod.yml，旁边放 .env（参考 .env.example）。
services:
  app:
    image: ghcr.io/yqin7/adi_monitor:latest
    container_name: adi_monitor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"     # 只绑回环：Docker 会绕过 ufw，不能靠主机防火墙；页面走 SSH 隧道
    env_file: .env
    # 容器 DNS 固定用阿里云内网解析：Tailscale 会改宿主机 resolv.conf（MagicDNS 100.100.100.100），
    # Docker 转发过去后容器里解析不到 Atlas 域名，服务起不来。显式指定后与 Tailscale 解耦。
    dns:
      - 100.100.2.136
      - 100.100.2.138
    environment:
      - PYTHONUNBUFFERED=1
      - SCHEDULER_ENABLED=1          # 云上常驻，开定时；本地调试关掉
      - SCRAPE_ALLOWED=true          # 抓取闸门：只有云服务器是 true，本地 .env 写 false（见 app/core/guard.py）
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
