# 服务器上用的 compose：不在本机构建，直接拉 CI 推到 GHCR 的镜像。
# 放到服务器 /opt/adi_monitor/docker-compose.prod.yml，旁边放 .env（参考 .env.example）。
services:
  app:
    image: ghcr.io/yqin7/adi_monitor:latest
    container_name: adi_monitor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"     # 回环：部署脚本的健康检查用
      # Tailscale 网卡：Mac/手机装了 Tailscale 后直接访问 http://100.x.x.x:8080/ui/，不走公网、不用隧道。
      # 地址在服务器 .env 里配 TAILSCALE_IP；没配时退回 127.0.0.2（也是回环，等于不开）。
      # 不要绑 0.0.0.0：Docker 绕过 ufw，公网只靠安全组一道墙，且服务没有登录。
      - "${TAILSCALE_IP:-127.0.0.2}:8080:8080"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - SCHEDULER_ENABLED=1          # 云上常驻，开定时；本地调试关掉
      - SCRAPE_ALLOWED=true          # 抓取闸门：只有云服务器是 true，本地 .env 写 false（见 app/core/guard.py）
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
