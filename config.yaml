mongodb:
  uri: "${MONGODB_URI}"       # 从环境变量读取
  database: "adidas_monitor"
  collection: "products"
  history_collection: "price_history"

scraper:
  # PLP (Product List Page) 翻页配置
  plp_workers: 12             # PLP 翻页并发线程数
  plp_sleep: 1.0              # 翻页间隔（秒）
  plp_max_retries: 4          # 重试次数

  # 库存 (Availability) 查询配置
  avail_workers: 24           # 库存查询并发线程数
  avail_retries: 5            # 重试容错
  avail_min_sleep: 0.4        # 每线程最小等待（秒）
  avail_max_sleep: 0.8        # 每线程最大等待（秒）
  avail_low_stock_qty: 5      # 低库存阈值

app:
  impersonate: "chrome131"    # curl_cffi 浏览器标识
  page_size: 48               # 每页商品数
  write_batch_size: 5000      # MongoDB 批写入大小
  request_timeout: 20         # 请求超时（秒）
  log_level: "INFO"           # 日志级别

# 代理配置（用于绕过 IP 限制/反爬）
proxy:
  enabled: false               # 是否启用代理
  protocol: "http"             # http / https / socks5
  host: ""                     # 代理服务器 IP 或域名
  port: 0                      # 代理服务器端口
  username: ""                 # 代理认证用户名（可选）
  password: ""                 # 代理认证密码（可选）
  use_env_proxy: false         # enabled=false 时是否仍沿用系统 HTTP_PROXY/HTTPS_PROXY
                               # 默认 false = 本地测试真正直连，不被系统代理接管

# Slack 通知配置
slack:
  enabled: true
  webhook_url: "${SLACK_WEBHOOK_URL}"     # 从环境变量读取
  mention_user_id: "${SLACK_USER_ID}"     # 可选，@通知用户

# 扫描和通知配置
notification:
  enabled: true
  scan_interval_minutes: 30          # 扫描间隔
  duplicate_notification_hours: 2    # 相同货2小时内不重复通知
  concurrent_workers: 24             # 并发扫描线程数

# ── 比价定价模型 ──────────────────────────────────────────────────────────────
pricing:
  fx:
    usd_cny: 7.12               # 美元 -> 人民币
    usd_hkd: 7.80               # 美元 -> 港币

  purchase:                     # 采购侧（Adidas 美国）
    sales_tax: 0.0              # 销售税，免税州填 0
    promo_rate: 1.0             # 兜底折扣（商品无 badge 促销码时用）。1.0 = 无码原价
                                # 实际折扣优先取商品 badge 里的码，如 "Extra 30% Off with CODE: EXTRA"
    cashback_bank: 0.02         # 银行卡返现，可与返利门户叠加
    cashback_portal: 0.10       # 返利门户返现（Rakuten / RetailMeNot 互斥，填最高的那个）

  sell_cn:                      # 国内卖出
    tax_rate: 0.155             # 香港报价 -> 国内成交基数的换算系数（含电商税与平台加价）
                                # 实测标定：27 个尺码对照买家端渠道最低价，倍数 1.1547±0.0048
                                # 详见 app/core/pricing.py 里的说明
    tech_fee_rate: 0.05         # 技术服务费
    transfer_fee_rate: 0.01     # 银行转账费
    after_sale_rate: 0.025      # 售后无忧
    operate_fee: 38             # 操作费（元）
    postage_subsidy: 10         # 消费者邮费补贴（元）

  sell_hk:                      # 香港卖出（港币）
    tech_fee_rate: 0.05
    tech_fee_min: 18            # 技术服务费下限
    transfer_fee_rate: 0.01
    threshold: 350              # 售价分档阈值
    operate_fee_low: 44         # 售价 < threshold
    operate_fee_high: 62        # 售价 >= threshold

  shipping:
    enabled: false              # 运费暂不计入，之后启用
    usd_per_item: 0.0

  filter:
    min_monthly_sales: 20       # 尺码级流动性门槛：30天销量低于此值不推荐
    min_profit_cny: 50          # 最低净利
    min_roi: 0.15               # 最低 ROI
