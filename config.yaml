mongodb:
  uri: "${MONGODB_URI}"       # 从环境变量读取
  database: "adidas_monitor"
  collection: "products"
  history_collection: "price_history"

scraper:
  # PLP (Product List Page) 翻页配置
  plp_workers: 12             # PLP 翻页并发线程数
  plp_sleep: 1.0              # 翻页间隔（秒）
  plp_max_retries: 4          # 重试次数

  # 库存 (Availability) 查询配置
  avail_workers: 24           # 库存查询并发线程数
  avail_retries: 5            # 重试容错
  avail_min_sleep: 0.4        # 每线程最小等待（秒）
  avail_max_sleep: 0.8        # 每线程最大等待（秒）
  avail_low_stock_qty: 5      # 低库存阈值

app:
  impersonate: "chrome131"    # curl_cffi 浏览器标识
  page_size: 48               # 每页商品数
  write_batch_size: 5000      # MongoDB 批写入大小
  request_timeout: 20         # 请求超时（秒）
  log_level: "INFO"           # 日志级别
